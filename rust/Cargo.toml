[package]
name = "gvibu"
version = "0.3.0"
edition = "2021"
description = "Unix-style multicall utility suite (58 commands)"
keywords = ["coreutils", "unix", "multicall", "busybox", "wasi"]
categories = ["command-line-utilities"]
repository = "https://github.com/luluthehungrycat/gvibu-ai-lab"
license = "MIT"

[[bin]]
name = "gvibu"
path = "src/main.rs"

[lib]
name = "gvibu"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
rand = "0.8"
regex = "1"
chrono = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# rand's thread_rng needs browser entropy on wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest = "1"
