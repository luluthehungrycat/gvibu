name: Parity Check (Python vs Rust)

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (if any)
        run: python -m pip install --upgrade pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Build Rust parity binary
        run: (cd rust && cargo build --manifest-path Cargo.toml)

      - name: Run Rust unit tests
        run: (cd rust && cargo test)

      - name: Run parity checks
        run: (python3 tooling/compare_impls.py)

      - name: Run Python unit tests
        run: pytest -q tests/
