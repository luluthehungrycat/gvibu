name: CI - Test, Compare, Build

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: python-ref
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Build Rust release binary
        run: (cd rust && cargo build --release)

      - name: Run Rust unit tests
        run: (cd rust && cargo test)

      - name: Run Python unit tests
        run: python -m pytest -q tests/

      - name: Run parity checks (Python vs Rust)
        run: python3 tooling/compare_impls.py

  wasm:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          targets: wasm32-wasip1,wasm32-unknown-unknown

      - name: Build WASM binary (wasmtime)
        run: (cd rust && cargo build --release --target wasm32-wasip1)

      - name: Install wasmtime
        run: curl -fsSL https://wasmtime.dev/install.sh | bash
        shell: bash

      - name: Test WASM binary via wasmtime
        run: |
          set -euo pipefail
          export PATH="$HOME/.wasmtime/bin:$PATH"
          wasm=rust/target/wasm32-wasip1/release/gvibu.wasm
          wasmtime run "$wasm" true
          test "$(wasmtime run "$wasm" echo hello)" = "hello"
          if wasmtime run "$wasm" false; then
            echo "false unexpectedly succeeded" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi

          stdin_output="$(printf 'alpha\nbeta\n' | wasmtime run "$wasm" cat)"
          test "$stdin_output" = "$(printf 'alpha\nbeta')"

          fixture_dir="$RUNNER_TEMP/gvibu-wasm-fixture"
          mkdir -p "$fixture_dir"
          printf 'from-file\n' > "$fixture_dir/input.txt"
          file_output="$(wasmtime run --dir "$fixture_dir::/fixtures" "$wasm" cat /fixtures/input.txt)"
          test "$file_output" = "from-file"

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build browser WASM with wasm-pack
        run: wasm-pack build wasm-lib --target web --out-dir pkg

      - name: Verify browser WASM output
        run: |
          ls -la wasm-lib/pkg/
          test -f wasm-lib/pkg/gvibu_wasm.js || (echo "Missing gvibu_wasm.js" && exit 1)
          test -f wasm-lib/pkg/gvibu_wasm_bg.wasm || (echo "Missing gvibu_wasm_bg.wasm" && exit 1)

      - name: Smoke test browser WASM bindings
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import init, { run_command } from './wasm-lib/pkg/gvibu_wasm.js';

          const wasm = await readFile('./wasm-lib/pkg/gvibu_wasm_bg.wasm');
          await init(wasm);
          const expect = (actual, expected, label) => {
            if (actual !== expected) {
              throw new Error(`${label}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
            }
          };
          expect(run_command('wc', ['-l'], 'one\n'), '      1\n', 'first stdin call');
          expect(run_command('wc', ['-l'], 'one\ntwo\n'), '      2\n', 'second stdin call');
          expect(run_command('wc', ['-l'], null), '      0\n', 'missing stdin call');
          for (const [name, args, message, label] of [
            ['ls', [], 'not supported on WebAssembly', 'unsupported command'],
            ['not-a-command', [], 'unknown command', 'unknown command'],
          ]) {
            try {
              run_command(name, args, null);
              throw new Error(`${label} unexpectedly succeeded`);
            } catch (error) {
              if (!String(error).includes(message)) throw error;
            }
          }
          NODE

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gvibu:ci -f Dockerfile .

      - name: Verify Docker image
        run: |
          docker run --rm gvibu:ci true && echo "PASS: true" || echo "FAIL: true"
          docker run --rm gvibu:ci whoami && echo "PASS: whoami" || echo "FAIL: whoami"
          docker run --rm gvibu:ci echo hello | grep -q hello && echo "PASS: echo" || echo "FAIL: echo"
